<div class="pt-28 pb-12 bg-[#FDFBF9] min-h-screen">
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-bold text-stone-900 mb-12 text-center">Browser our collection </h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            @for(product of products(); track product.id) {
            <div class="group cursor-pointer" [routerLink]="['/shop', product.id]">
                <div
                    class="relative overflow-hidden rounded-xl bg-white aspect-[4/5] mb-4 shadow-sm group-hover:shadow-md transition-all">
                    <img [src]="product.image" [alt]="product.productName"
                        class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500" />
                    <button
                        class="absolute bottom-4 right-4 bg-white p-3 rounded-full shadow-md text-stone-800 opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition-all duration-300 hover:bg-orange-500 hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </button>
                </div>
                <h3 class="font-medium text-stone-900 text-lg mb-1">{{product.productName}}</h3>
                <p class="text-sm text-stone-500 mb-2 line-clamp-2">{{product.description || 'No description
                    available'}}
                </p>
                <p class="text-stone-900 font-bold">GHS {{product.price}}</p>
            </div>
            }
        </div>
    </div>
</div>
